<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Gブロック</title>
<meta property="og:title" content="Gブロック">
<meta property="og:description" content="こうちゃん × Gくん 制作ゲーム">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gkunjiuko5523.github.io/gkun-block-kuzushi/g-block-ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#202738,#090b10 65%);
  color:white;
  font-family:sans-serif;
  text-align:center;
  min-height:100vh;
}

main{
  width:min(96vw,960px);
  margin:auto;
  padding:6px 10px 10px;
}

h2{
  margin:2px 0 1px;
  font-size:26px;
  line-height:1.15;
  letter-spacing:2px;
  text-shadow:0 0 12px #4d96ff;
}

.credit{
  display:block;
  margin-bottom:3px;
  opacity:.75;
  font-size:12px;
}

.topbar{
  margin:3px 0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.status{
  white-space:nowrap;
}

.buttons{
  display:flex;
  gap:5px;
  justify-content:center;
}

button{
  padding:8px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  font-size:14px;
}

#gamewrap{
  width:100%;
  margin:auto;
}

canvas{
  width:100%;
  height:auto;
  aspect-ratio:700/560;
  background:linear-gradient(#070b14,#020204);
  border:1px solid #778;
  border-radius:10px;
  box-shadow:0 0 20px rgba(77,150,255,.18);
  touch-action:none;
  display:block;
}

#touchpad{
  display:none;
}

.help{
  margin:5px 0 0;
  font-size:12px;
  opacity:.7;
}

/* スマホ */
@media (max-width:700px){

  main{
    width:100%;
    padding:3px 6px 6px;
  }

  h2{
    font-size:21px;
    margin:1px 0 0;
  }

  .credit{
    font-size:11px;
    margin-bottom:2px;
  }

  .topbar{
    display:block;
    margin:2px 0 4px;
  }

  .status{
    font-size:14px;
    margin-bottom:3px;
  }

  .buttons{
    width:100%;
    gap:3px;
  }

  button{
    flex:1;
    padding:7px 2px;
    font-size:11px;
    margin:0;
  }

  canvas{
    aspect-ratio:auto;
    height:min(64vh,680px);
    border-radius:8px 8px 0 0;
  }

  #touchpad{
    height:76px;
    border:1px solid #666;
    border-top:0;
    border-radius:0 0 8px 8px;
    background:linear-gradient(#181818,#101010);
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:13px;
  }

  .help{
    margin-top:3px;
    font-size:11px;
  }

  .pcHelp{
    display:none;
  }
}
</style>
</head>

<body>
<main>

<h2>Gブロック</h2>
<span class="credit">こうちゃん × Gくん 制作ゲーム</span>

<div class="topbar">
  <div class="status">
    スコア <b id="s">0</b>　
    ライフ <b id="l">3</b>
  </div>

  <div class="buttons">
    <button id="go">スタート / リセット</button>
    <button id="pause">一時停止</button>
    <button id="sound">🔊 音ON</button>
  </div>
</div>

<div id="gamewrap">
  <canvas id="c" width="700" height="700"></canvas>

  <div id="touchpad">
    ここを左右になぞってパドル操作
  </div>
</div>

<p class="help">
  <span class="pcHelp">PC：マウス・← → キー　</span>
  ゲーム画面クリック / タップ：PAUSE・再開
</p>

</main>

<script>
const c=document.querySelector('#c');
const x=c.getContext('2d');
const S=document.querySelector('#s');
const L=document.querySelector('#l');
const pauseBtn=document.querySelector('#pause');
const soundBtn=document.querySelector('#sound');
const tp=document.querySelector('#touchpad');
const gamewrap=document.querySelector('#gamewrap');

const W=700;
const H=700;

let p,b,bs,score,lives,on,id,waiting,paused;
let soundOn=true;
let audioCtx=null;
let flash=null;

/* ---------- 音 ---------- */

function makeAudio(){
  if(!soundOn)return null;

  if(!audioCtx || audioCtx.state==='closed'){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }

  if(audioCtx.state==='suspended'){
    audioCtx.resume().catch(()=>{});
  }

  return audioCtx;
}

function wakeAudio(){
  if(!soundOn)return;

  try{
    const a=makeAudio();
    if(a && a.state==='suspended'){
      a.resume().catch(()=>{});
    }
  }catch(e){}
}

function beep(freq,duration,type='square',volume=.07,endFreq=null){
  if(!soundOn)return;

  const a=makeAudio();
  if(!a)return;

  const play=()=>{
    try{
      const o=a.createOscillator();
      const g=a.createGain();

      o.type=type;
      o.frequency.setValueAtTime(freq,a.currentTime);

      if(endFreq){
        o.frequency.exponentialRampToValueAtTime(
          endFreq,
          a.currentTime+duration
        );
      }

      g.gain.setValueAtTime(volume,a.currentTime);
      g.gain.exponentialRampToValueAtTime(
        .0001,
        a.currentTime+duration
      );

      o.connect(g);
      g.connect(a.destination);

      o.start();
      o.stop(a.currentTime+duration);
    }catch(e){}
  };

  if(a.state==='suspended'){
    a.resume().then(play).catch(()=>{});
  }else{
    play();
  }
}

function wallSound(){
  beep(180,.025,'square',.035);
}

function paddleSound(){
  beep(420,.045,'square',.07);
}

function brickSound(){
  beep(720,.055,'square',.075);
}

function missSound(){
  beep(190,.28,'sawtooth',.06,75);
}

function clearSound(){
  if(!soundOn)return;

  beep(523,.10,'square',.07);
  setTimeout(()=>beep(659,.10,'square',.07),110);
  setTimeout(()=>beep(784,.18,'square',.07),220);
}

/* 自動スリープ等からの復帰対策 */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    wakeAudio();
  }
});

window.addEventListener('pageshow',()=>{
  wakeAudio();
});

/* ---------- 初期化 ---------- */

function init(){
  cancelAnimationFrame(id);

  score=0;
  lives=3;
  on=false;
  waiting=false;
  paused=false;
  flash=null;

  p={
    x:292,
    y:H-35,
    w:116,
    h:14
  };

  b={
    x:350,
    y:H-60,
    r:8,
    vx:4,
    vy:-4
  };

  bs=[];

  for(let r=0;r<5;r++){
    for(let q=0;q<8;q++){
      bs.push({
        x:28+q*81,
        y:55+r*30,
        w:74,
        h:22,
        a:1,
        r
      });
    }
  }

  pauseBtn.textContent='一時停止';

  sync();
  draw('スタートを押してね');
}

function sync(){
  S.textContent=score;
  L.textContent=lives;
}

/* ---------- 描画 ---------- */

function draw(msg=''){
  x.clearRect(0,0,W,H);

  x.fillStyle='rgba(255,255,255,.035)';

  for(let i=0;i<48;i++){
    const sx=(i*137)%W;
    const sy=(i*83)%(H-70);
    x.fillRect(sx,sy,2,2);
  }

  const cs=[
    ['#ff7979','#d63031'],
    ['#ffbe76','#e17055'],
    ['#ffe66d','#d6a800'],
    ['#7bed9f','#2eaa60'],
    ['#70a1ff','#3867d6']
  ];

  for(const z of bs){
    if(!z.a)continue;

    const grad=x.createLinearGradient(
      z.x,z.y,z.x,z.y+z.h
    );

    grad.addColorStop(0,cs[z.r][0]);
    grad.addColorStop(1,cs[z.r][1]);

    x.shadowColor=cs[z.r][0];
    x.shadowBlur=7;
    x.fillStyle=grad;

    x.beginPath();
    x.roundRect(z.x,z.y,z.w,z.h,4);
    x.fill();

    x.shadowBlur=0;

    x.fillStyle='rgba(255,255,255,.28)';
    x.fillRect(z.x+4,z.y+3,z.w-8,3);
  }

  if(flash){
    x.beginPath();
    x.arc(flash.x,flash.y,flash.r,0,Math.PI*2);

    x.fillStyle=
      `rgba(255,255,255,${flash.alpha})`;

    x.fill();

    flash.r+=3;
    flash.alpha-=.12;

    if(flash.alpha<=0){
      flash=null;
    }
  }

  const pg=x.createLinearGradient(
    p.x,p.y,p.x,p.y+p.h
  );

  pg.addColorStop(0,'#ffffff');
  pg.addColorStop(.45,'#bfe4ff');
  pg.addColorStop(1,'#5689b8');

  x.shadowColor='#63c7ff';
  x.shadowBlur=12;
  x.fillStyle=pg;

  x.beginPath();
  x.roundRect(p.x,p.y,p.w,p.h,7);
  x.fill();

  x.shadowBlur=0;

  const bg=x.createRadialGradient(
    b.x-3,b.y-3,1,
    b.x,b.y,b.r+3
  );

  bg.addColorStop(0,'#ffffff');
  bg.addColorStop(.45,'#dff6ff');
  bg.addColorStop(1,'#55bfff');

  x.shadowColor='#65d5ff';
  x.shadowBlur=14;

  x.beginPath();
  x.arc(b.x,b.y,b.r,0,Math.PI*2);
  x.fillStyle=bg;
  x.fill();

  x.shadowBlur=0;

  if(msg){
    x.fillStyle='rgba(0,0,0,.60)';
    x.fillRect(0,H/2-45,W,90);

    x.fillStyle='white';
    x.font='bold 30px sans-serif';
    x.textAlign='center';

    x.shadowColor='#4d96ff';
    x.shadowBlur=12;

    x.fillText(msg,W/2,H/2+10);

    x.shadowBlur=0;
  }
}

/* ---------- ゲーム ---------- */

function loop(){
  if(!on)return;

  b.x+=b.vx;
  b.y+=b.vy;

  if(b.x<b.r){
    b.x=b.r;
    b.vx=Math.abs(b.vx);
    wallSound();
  }

  if(b.x>W-b.r){
    b.x=W-b.r;
    b.vx=-Math.abs(b.vx);
    wallSound();
  }

  if(b.y<b.r){
    b.y=b.r;
    b.vy=Math.abs(b.vy);
    wallSound();
  }

  if(b.y>H+8){
    missSound();

    if(--lives<=0){
      sync();
      on=false;
      waiting=false;
      draw('GAME OVER');
      return;
    }

    b.x=W/2;
    b.y=H-60;
    b.vx=4*(Math.random()<.5?-1:1);
    b.vy=-4;

    sync();

    on=false;
    waiting=true;

    draw('クリック / タッチで再開');
    return;
  }

  if(
    b.vy>0 &&
    b.y+b.r>=p.y &&
    b.y-b.r<=p.y+p.h &&
    b.x>=p.x &&
    b.x<=p.x+p.w
  ){
    const h=
      (b.x-(p.x+p.w/2))/(p.w/2);

    b.vx=5*h;

    b.vy=-Math.sqrt(
      Math.max(4,32-b.vx*b.vx)
    );

    b.y=p.y-b.r-1;

    paddleSound();
  }

  for(const z of bs){
    if(
      z.a &&
      b.x+b.r>z.x &&
      b.x-b.r<z.x+z.w &&
      b.y+b.r>z.y &&
      b.y-b.r<z.y+z.h
    ){
      z.a=0;
      b.vy*=-1;

      score+=10;
      sync();

      flash={
        x:b.x,
        y:b.y,
        r:5,
        alpha:.8
      };

      brickSound();
      break;
    }
  }

  if(bs.every(z=>!z.a)){
    on=false;
    clearSound();
    draw('CLEAR!');
    return;
  }

  draw();

  id=requestAnimationFrame(loop);
}

/* ---------- パドル ---------- */

function movePaddleFromClientX(clientX){
  const r=c.getBoundingClientRect();

  const v=
    (clientX-r.left)*W/r.width;

  p.x=Math.max(
    0,
    Math.min(W-p.w,v-p.w/2)
  );
}

/*
 PCではCanvasの外にマウスが出ても
 ページ上の横位置からパドルを動かす。
*/
document.addEventListener('mousemove',e=>{
  if(window.matchMedia('(pointer:fine)').matches){
    movePaddleFromClientX(e.clientX);
  }
});

/* ---------- PAUSE ---------- */

function resumeWaiting(){
  if(!waiting)return false;

  wakeAudio();

  waiting=false;
  paused=false;
  on=true;

  pauseBtn.textContent='一時停止';

  loop();

  return true;
}

function togglePause(){

  wakeAudio();

  if(resumeWaiting()){
    return;
  }

  if(!on && !paused){
    return;
  }

  if(on){
    paused=true;
    on=false;

    cancelAnimationFrame(id);

    pauseBtn.textContent='再開';

    draw('PAUSE');

  }else if(paused){

    paused=false;
    on=true;

    pauseBtn.textContent='一時停止';

    wakeAudio();

    loop();
  }
}

/* PCクリック */
c.addEventListener('click',()=>{
  togglePause();
});

/* スマホタップ */
c.addEventListener(
  'touchstart',
  e=>{
    e.preventDefault();
    togglePause();
  },
  {passive:false}
);

/* ---------- スマホ操作 ---------- */

function touchMove(e){
  e.preventDefault();

  const t=e.touches[0];

  if(!t)return;

  const r=tp.getBoundingClientRect();

  const ratio=Math.max(
    0,
    Math.min(
      1,
      (t.clientX-r.left)/r.width
    )
  );

  p.x=ratio*(W-p.w);

  if(!on){
    if(paused){
      draw('PAUSE');
    }else if(waiting){
      draw('クリック / タッチで再開');
    }else{
      draw('スタートを押してね');
    }
  }
}

tp.addEventListener(
  'touchstart',
  e=>{
    wakeAudio();

    if(waiting){
      resumeWaiting();
    }

    touchMove(e);
  },
  {passive:false}
);

tp.addEventListener(
  'touchmove',
  touchMove,
  {passive:false}
);

/* ---------- キーボード ---------- */

document.addEventListener('keydown',e=>{

  if(e.key==='ArrowLeft'){
    p.x=Math.max(0,p.x-30);
  }

  if(e.key==='ArrowRight'){
    p.x=Math.min(W-p.w,p.x+30);
  }
});

/* ---------- ボタン ---------- */

document.querySelector('#go').onclick=()=>{

  wakeAudio();

  init();

  on=true;

  loop();
};

pauseBtn.onclick=()=>{
  togglePause();
};

soundBtn.onclick=()=>{

  soundOn=!soundOn;

  soundBtn.textContent=
    soundOn
      ? '🔊 音ON'
      : '🔇 音OFF';

  if(soundOn){
    wakeAudio();

    setTimeout(()=>{
      beep(520,.07,'square',.07);
    },20);
  }
};

init();
</script>

</body>
</html>
